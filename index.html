<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCPL - Season System</title>
<style>
body{
  margin:0;
  font-family:Arial;
  color:white;

  background:linear-gradient(to left, rgba(0,0,0,0.9) 50%, rgba(0,0,0,0.3)),
    url('GOI2.jpg') left top no-repeat;

  background-size: cover;
  background-attachment: fixed;
}
header{text-align:center;padding:25px;background:#021a40}
nav{display:flex;justify-content:center;gap:15px;background:#021a40;padding:10px}
nav a{color:white;text-decoration:none}
section{padding:25px}
.card{background:white;color:black;padding:15px;border-radius:8px;margin:10px 0}
button{padding:10px;background:#ffcc00;border:none;border-radius:5px;cursor:pointer}
#adminPanel{display:none}
</style>
</head>
<body><header>
<h1>🏏 RCPL</h1>
<h2 id="seasonText"></h2>
</header><nav>
<a href="#register">Add Player</a>
<a href="#list">Players</a>
<a href="#admin">Admin</a>
</nav><section id="register">
<h3>Add Player</h3>
<div class="card">
<form onsubmit="addPlayer(event)">
<input id="name" placeholder="Name" required><br>
<input id="age" placeholder="Age" required><br>
<select id="role">
<option>Batsman</option>
<option>Bowler</option>
<option>All-Rounder</option>
</select><br><br>
<button>Add</button>
</form>
</div>
</section><section id="list">
<h3>Players</h3>
<div id="playerList"></div>
</section><section id="admin">
<h3>Admin</h3>
<div class="card">
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">Login</button>
</div><div id="adminPanel" class="card">
<h4>Season Control</h4>
<input id="seasonNo" placeholder="Season No (e.g. 12)">
<input id="seasonYear" placeholder="Year (e.g. 2027)">
<button onclick="updateSeason()">Update Season</button><h4>Actions</h4>
<button onclick="clearPlayers()">Clear Players</button>
</div>
</section><script>
let seasonNo = localStorage.getItem('seasonNo') || 11;
let seasonYear = localStorage.getItem('seasonYear') || 2026;

function updateHeader(){
 document.getElementById('seasonText').innerHTML = `Season-${seasonNo} (${seasonYear})`;
}
updateHeader();

function getKey(){
 return 'players_'+seasonNo;
}

let players = JSON.parse(localStorage.getItem(getKey())) || [];
displayPlayers();

function addPlayer(e){
 e.preventDefault();
 let p={
  name:document.getElementById('name').value,
  age:document.getElementById('age').value,
  role:document.getElementById('role').value
 };
 players.push(p);
 localStorage.setItem(getKey(), JSON.stringify(players));
 displayPlayers();
 e.target.reset();
}

function displayPlayers(){
 let d=document.getElementById('playerList');
 d.innerHTML='';
 players.forEach(p=>{
  d.innerHTML+=`<div class='card'>${p.name} - ${p.role}</div>`;
 });
}

function login(){
 if(document.getElementById('pass').value==='rcpl123'){
  document.getElementById('adminPanel').style.display='block';
 }
}

function updateSeason(){
 let newNo=document.getElementById('seasonNo').value;
 let newYear=document.getElementById('seasonYear').value;

 if(newNo) seasonNo=newNo;
 if(newYear) seasonYear=newYear;

 localStorage.setItem('seasonNo',seasonNo);
 localStorage.setItem('seasonYear',seasonYear);

 players = JSON.parse(localStorage.getItem(getKey())) || [];
 updateHeader();
 displayPlayers();
 alert('Season Updated');
}

function clearPlayers(){
 localStorage.removeItem(getKey());
 players=[];
 displayPlayers();
}
</script></body>
</html>
