<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RCPL Season-11</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{
  margin:0;
  font-family: Arial;
  color:white;
  background:#021a40;
}

/* LEFT IMAGE */
.left-image{
  position: fixed;
  left:0;
  top:0;
  width:35%;
  height:100%;
}
.left-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MAIN CONTENT */
.main{
  margin-left:35%;
  padding:20px;
}

input,select,button{
  padding:8px;
  margin:5px;
}

.card{
  background:white;
  color:black;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LEFT IMAGE -->
<div class="left-image">
  <img src="GOI2.jpg">
</div>

<!-- MAIN -->
<div class="main">
  <h1>RCPL Season-11 (2026)</h1>

  <h3>Add Player</h3>
  <input id="name" placeholder="Name">
  <input id="age" placeholder="Age">
  <select id="role">
    <option>Batsman</option>
    <option>Bowler</option>
    <option>All-Rounder</option>
  </select>
  <button onclick="addPlayer()">Add</button>

  <h3>Players</h3>
  <div id="players"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "rcpl206.firebaseapp.com",
  databaseURL: "https://rcpl206-default-rtdb.firebaseio.com",
  projectId: "rcpl206",
  storageBucket: "rcpl206.appspot.com",
  messagingSenderId: "123214509684",
  appId: "1:123214509684:web:xxxx"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function addPlayer(){
  const name = document.getElementById("name").value;
  const age = document.getElementById("age").value;
  const role = document.getElementById("role").value;

  db.ref("players").push({
    name, age, role
  });
}

db.ref("players").on("value", snapshot=>{
  const data = snapshot.val();
  const div = document.getElementById("players");

  div.innerHTML = "";

  if(data){
    for(let id in data){
      div.innerHTML += `
        <div class="card">
          ${data[id].name} (${data[id].age}) - ${data[id].role}
        </div>
      `;
    }
  }
});
